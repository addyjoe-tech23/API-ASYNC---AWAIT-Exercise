<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: hsl(198, 64%, 89%);
            margin:0;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            display: grid;
            grid-template-rows: 1fr 1fr;
        }
        .card{
            background-color: hsl(193, 76%, 68%);
            width: 400px;
            height: 200px;
            margin:  auto;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
            border:7px solid hsl(193, 52%, 24%);
        }
        .card h2{
            font-size: 1.5rem;
            color: hsl(236, 93%, 53%);
        }
        button{
            background-color: hsl(193, 52%, 24%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.5rem;
            margin-top: 30px;
        }
        .header-card{
            text-align: center;
            margin-top: 50px;
            margin-bottom: 10px;
            border: 4px solid hsl(245, 79%, 26%);
            padding:20px;
            border-radius: 10px;
            font-size: 0.8rem;
            color:hsl(23, 93%, 48%);
            background-color: hsl(193, 46%, 30%);
            font-weight: bold;
        }
        .header-card :hover{
            transition: all 0.7s ease-in-out;
            transform:scale(1.1);
            box-shadow: 0px 0px 20px hsla(0, 13%, 16%, 0.2);
         }
        .header-card h1:hover{
            color:hsl(25, 86%, 54%);
            cursor:pointer;
            pointer-events: auto;

        }
        button:hover{
            background-color: hsl(193, 52%, 30%);
        }

    </style>
</head>
<body>
       <div class="header-card">
        <h1>ADDY'S ADVICE GENERATOR</h1>
        </div>
       <div class="card">
        <h2 id="advice-text">Click the button for advice</h2>
        <button id="fetch-btn">Get Advice</button>
       </div>
       <script src="app.js"> </script>
</body>
</html>
